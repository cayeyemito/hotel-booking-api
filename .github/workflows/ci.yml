name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers usa el Docker que ya traen los runners de GitHub.
      - name: Tests y build
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
